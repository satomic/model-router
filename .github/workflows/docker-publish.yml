name: Build and Publish Docker Image

on:
  # A published image comes from a version tag, so every image traces back to a named
  # release rather than to whatever main happened to hold.
  push:
    tags: ["v*"]
  # Lets a build be started by hand from the Actions tab -- useful to re-publish after a
  # registry hiccup without inventing a throwaway tag.
  workflow_dispatch:
  # Pull requests build but never push: it verifies the Dockerfile still builds without
  # granting a fork's PR the ability to publish under this repository's name.
  pull_request:
    paths:
      - Dockerfile.go
      - .dockerignore
      - server-go/**
      - frontend/**
      - .github/workflows/docker-publish.yml

env:
  REGISTRY: ghcr.io
  # Spelled out rather than ${{ github.repository }}: the image name is part of the published
  # contract that people put in `docker pull`, so it must not change out from under them just
  # because the repository was renamed. The owner still comes from the repository, so a fork
  # publishes under its own account.
  IMAGE_NAME: model-router

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Required for pushing to GHCR with the automatic GITHUB_TOKEN, so no PAT has to be
      # stored as a secret.
      packages: write

    strategy:
      matrix:
        include:
          # The Go backend carries the unsuffixed tags, so `docker pull <image>:latest` and
          # `:2.0.0` are the Go image. It is what a deployment should run: it holds roughly twice
          # the concurrent in-flight requests at a fraction of the latency and memory. See
          # docs/backend-benchmark.md.
          #
          # The Python image is no longer published: new features land in the Go backend only,
          # so a `-py` tag would advertise an image that quietly lacks them. The `-py` tags
          # already in the registry stay pullable; they just stop moving. Kept as a one-entry
          # matrix so the per-backend cache scope and the smoke-test volume name stay unchanged.
          - backend: go
            dockerfile: Dockerfile.go
            # No flavor at all rather than an empty suffix=: this leg should not be relying on
            # how the action reads a blank value.
            flavor: ""

    name: ${{ matrix.backend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # arm64 is built under emulation; without QEMU the arm64 half of the manifest fails.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # A registry reference must be lowercase, while a GitHub account name may contain
      # capitals -- and the ${{ }} expression syntax has no lowercase function, so it is done
      # here once and reused by every step below.
      - name: Resolve the image reference
        id: image
        run: |
          echo "ref=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Skipped for pull requests: a PR build does not push, so it needs no credentials.
      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # The fallback for a workflow_dispatch off a branch. Without it such a run produces
            # NO tags at all -- all three semver patterns need a version tag, type=ref,event=tag
            # needs a tag event, and `latest` is guarded below -- and a push with an empty tag
            # list is a failure, not a no-op.
            type=raw,value=branch-{{sha}},enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
          # A tag v2.1.0 therefore publishes 2.1.0, 2.1, 2, v2.1.0 and latest -- so a
          # deployment can pin as tightly or as loosely as it wants. `latest` is guarded on
          # the ref being a version tag: a manual workflow_dispatch run off a branch must not
          # move `latest` to an unreleased build, so it gets a throwaway branch-<sha> tag
          # instead and `latest` keeps pointing at the last real release.
          #
          # The Go leg passes nothing here, so its tags are exactly what this repository
          # published before a second backend existed.
          flavor: ${{ matrix.flavor }}

      - name: Build and push
        timeout-minutes: 55
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Actions cache, NOT a registry cache tag. A registry cache written to
          # `<image>:buildcache` lands in the same package as the releases: it shows up in the
          # package's tag list, and because the cache is exported *after* the image push it is
          # the most recent manifest, so GHCR promotes it to the package's headline and suggests
          # `docker pull ...:buildcache` -- a cache manifest, which will not run. Never point a
          # cache export at the package people pull from.
          #
          # The honest trade: on a tags-only trigger the Actions cache is usually cold, because a
          # run writes to its own ref's scope and can only read its own scope plus the default
          # branch's, and nothing builds on the default branch. So this mostly helps a re-run of
          # the same tag. That is the right price for a build that runs a few times per release.
          # If the emulated arm64 leg ever becomes the bottleneck, the fix is a *separate* cache
          # package (ref=${{ steps.image.outputs.ref }}-cache:latest), not a tag on this one.
          #
          # Scoped per backend: the two legs share nothing -- different base images, different
          # dependency steps -- so an unscoped cache would have each run evicting the other's
          # layers and neither would ever hit.
          cache-from: type=gha,scope=${{ matrix.backend }}
          cache-to: type=gha,mode=max,scope=${{ matrix.backend }}

      # Fails the run if the image cannot serve /healthz, so a broken image is never left
      # sitting under `latest` with a green check next to it. amd64 only -- the runner cannot
      # execute the arm64 image without paying emulation for a whole boot.
      - name: Smoke-test the published image
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          VOLUME="smoke-${{ matrix.backend }}"
          docker volume rm -f "$VOLUME" > /dev/null 2>&1 || true
          docker run -d --name smoke -p 8000:8000 -v "$VOLUME":/data "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz > /tmp/health.json; then
              echo "healthy after ${i}s: $(cat /tmp/health.json)"

              # The config must have been created on the empty volume, and the traces directory
              # must sit under the same mount: that single-volume layout plus the auto-creation
              # is what makes `docker run` need no preparation at all. Asserted rather than
              # assumed -- a path regression would otherwise only show up as somebody's
              # configuration vanishing on their next upgrade.
              #
              # Checked from a busybox container over the same volume rather than with
              # `docker exec`: the volume is what survives an upgrade, so it is the honest thing
              # to assert, and one form of the check then covers both backends regardless of
              # what either image happens to contain.
              docker run --rm -v "$VOLUME":/data busybox sh -eu -c '
                test -f /data/config.yaml || { echo "config.yaml was not created"; exit 1; }
                test -d /data/logs || { echo "the traces directory is missing"; exit 1; }
                echo "config.yaml auto-created on the volume OK"
                echo "traces directory is on the volume OK"
              '

              # The server must be able to write there as the unprivileged uid it runs as. A
              # named volume inherits the ownership of the image directory it is mounted over, so
              # a regression here is a first-start failure for every new deployment -- and
              # invisible on a bind mount the operator had already chowned by hand.
              owner=$(docker run --rm -v "$VOLUME":/data busybox stat -c '%u' /data)
              if [ "$owner" != "10001" ]; then
                echo "::error::/data on the volume is owned by uid $owner, not the 10001 the server runs as"
                exit 1
              fi
              echo "volume /data is owned by uid $owner OK"

              docker rm -f smoke > /dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::the image did not answer /healthz within 30s"
          docker logs smoke
          exit 1
