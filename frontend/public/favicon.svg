<!-- The browser tab icon: one request fanning out to three backend models, which is the whole
     product in one glyph. Drawn as a filled Azure-blue tile rather than bare strokes so it holds
     its shape against both a light and a dark browser chrome.

     The geometry is set by the 16px case, not by how it looks large. The three output nodes sit on
     a 9.4-unit pitch and are deliberately smaller than the input node: at an earlier 7.5-unit
     pitch they merged into one solid bar when downsampled to a tab, which is the only size most
     people ever see this at. tmp/make_favicon.py redraws the same coordinates for the .ico. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#0078D4" />
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round">
    <!-- Straight segments only: a right-angled bend survives downsampling, a bezier turns to mush. -->
    <path d="M7.8 16h7.2" />
    <path d="M15 6.6v18.8" />
    <path d="M15 6.6h6.6" />
    <path d="M15 16h6.6" />
    <path d="M15 25.4h6.6" />
  </g>
  <g fill="#ffffff">
    <circle cx="7.8" cy="16" r="3" />
    <circle cx="24" cy="6.6" r="2.5" />
    <circle cx="24" cy="16" r="2.5" />
    <circle cx="24" cy="25.4" r="2.5" />
  </g>
</svg>
